status = info
name = ""

appenders = console, rolling, locality
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss.SSS}][%-5p] [%-15c{1}:%L] - %m%n

appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = locality.log
appender.rolling.filePattern = locality-%d{yyyyMMddHH}-%i.log
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss.SSS}][%-5p] [%-15c{1}:%L] - %m%n
appender.rolling.policies.type = Policies
appender.rolling.policies.time.type = TimeBasedTriggeringPolicy
appender.rolling.policies.time.interval = 24
appender.rolling.policies.time.modulate = true
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size=512MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 20

appender.locality.type = RollingFile
appender.locality.name = localityRollingFile
appender.locality.fileName = locality.log
appender.locality.filePattern = locality-%d{yyyyMMddHH}-%i.log
appender.locality.layout.type = PatternLayout
appender.locality.layout.pattern = [%d{yyyy-MM-dd HH:mm:ss.SSS}][locality][%-5p] [%-15c{1}:%L] - %m%n
appender.locality.policies.type = Policies
appender.locality.policies.time.type = TimeBasedTriggeringPolicy
appender.locality.policies.time.interval = 24
appender.locality.policies.time.modulate = true
appender.locality.policies.size.type = SizeBasedTriggeringPolicy
appender.locality.policies.size.size=512MB
appender.locality.strategy.type = DefaultRolloverStrategy
appender.locality.strategy.max = 20

rootLogger.level = info
rootLogger.appenderRefs = stdout,file
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.file.ref = RollingFile

#
loggers = locality, springframework
# locality
logger.locality.name = com.alipay.oceanbase.locality
logger.locality.additivity = false
logger.locality.level = info
logger.locality.appenderRefs = stdout,file
logger.locality.appenderRef.stdout.ref = STDOUT
logger.locality.appenderRef.file.ref = localityRollingFile
#spring
logger.springframework.name = org.springframework
logger.springframework.additivity = false
logger.springframework.level = info
logger.springframework.appenderRefs = stdout,file
logger.springframework.appenderRef.stdout.ref = STDOUT
logger.springframework.appenderRef.file.ref = RollingFile

