# 数据源,必须配置
jdbc.url=jdbc:oceanbase://127.1:2828/
# 连接属性, 可不改
duridProperty=initialSize=4;maxActive=64;minIdle=4;maxWait=600000
jdbcProperty=useServerPrepStmts=false;emulateUnsupportedPstmts=false;characterEncoding=UTF-8;prepStmtCacheSqlLimit=1000;enableQueryTimeouts=false;useLocalSessionState=false;useLocalTransactionState=false;socketTimeout=600000;allowMultiQueries=true;rewriteBatchedStatements=true;

#UselocalityParam 是否指定locality变更序列，false 使用默认FF<-->FFF
# localityChangeParam 自定义的locality 变更序列,每个locality之间分号;隔开，需要保证相邻的两个locality是能进行转换的
# eg:"F@z1,F@z2,F@z3","F@z1,F@z2","F@z1,F@z2,F@z3","F@z1,F@z3","F@z1,F@z2,F@z3","F@z2,F@z3"
#locality 由 F@z1,F@z2,F@z3 --》 F@z1,F@z2--》F@z1,F@z2,F@z3--》F@z1,F@z3--》F@z1,F@z2,F@z3--》F@z2,F@z3 循环进行这个过程
UselocalityParam=true
localityChangeParam=F@z1,F@z2,F@z3;F@z1,F@z2;F@z1,F@z2,F@z3;F@z1,F@z3;F@z1,F@z2,F@z3;F@z2,F@z3
#locality 状态变更执行的间隔时间，单位：分
localityChangeInterval=2

#指定集群中的特定租户变更
special.tenant_mode=true
#指定集群中的特定租户变更,支持不同的租户使用不同的变更系列，用#分割
special.tenant_name=sys,mysql_tenant,oracle_tenant
#对应租户的变更序列，不同的分割序列用#划分
special.localityChangeParam=F@z1,F@z2,F@z3;F@z1,F@z2#F@z1,F@z2,F@z3;F@z1,F@z2,F@z3,F@z4;F@z1,F@z2,F@z3,F@z4,F@z5

#observer 版本
observer.version=4.0.0.0
#locality变更时是否扩缩容pool，目前只支持创建租户时只指定一个pool时，才能扩缩容pool
localityChangePool=false
